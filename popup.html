<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      background: #1a1a1b;
      color: #d7dadc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 { font-size: 13px; font-weight: 600; letter-spacing: 3px; color: #818384; }

    #power-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #343536;
      background: #111112;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    #power-btn svg { width: 36px; height: 36px; }
    #power-btn .ring { fill: none; stroke: #343536; stroke-width: 3; transition: stroke 0.2s; }
    #power-btn .stem { fill: none; stroke: #343536; stroke-width: 3; stroke-linecap: round; transition: stroke 0.2s; }

    #power-btn.on { border-color: #4fbdba; box-shadow: 0 0 18px #4fbdba44; }
    #power-btn.on .ring { stroke: #4fbdba; }
    #power-btn.on .stem { stroke: #4fbdba; }

    #status {
      font-size: 11px;
      color: #818384;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: -8px;
    }
    #status.on { color: #4fbdba; }

    #site-label {
      font-size: 10px;
      color: #4a4a4b;
      margin-top: -8px;
    }

    .divider {
      width: 100%;
      border: none;
      border-top: 1px solid #2a2a2b;
    }

    .counters {
      width: 100%;
      display: flex;
      gap: 8px;
    }
    .counter {
      flex: 1;
      background: #272729;
      border: 1px solid #343536;
      border-radius: 6px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .counter-value {
      font-size: 18px;
      font-weight: 600;
      color: #d7dadc;
      line-height: 1;
    }
    .counter-value.has-data { color: #e06c75; }
    .counter-label {
      font-size: 9px;
      color: #818384;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #clear-btn {
      width: 100%;
      padding: 9px;
      background: #272729;
      border: 1px solid #343536;
      border-radius: 6px;
      color: #818384;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    #clear-btn:hover { border-color: #e06c75; color: #e06c75; background: #1e1617; }
    #clear-btn.cleared { border-color: #4fbdba; color: #4fbdba; background: #111918; }

    #suspend-btn {
      width: 100%;
      padding: 9px;
      background: #272729;
      border: 1px solid #343536;
      border-radius: 6px;
      color: #818384;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    #suspend-btn:hover { border-color: #c678dd; color: #c678dd; background: #1a1520; }
    #suspend-btn.done { border-color: #4fbdba; color: #4fbdba; background: #111918; }

    #notion-dl-btn {
      width: 100%;
      padding: 9px;
      background: #272729;
      border: 1px solid #343536;
      border-radius: 6px;
      color: #818384;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    #notion-dl-btn:hover { border-color: #61afef; color: #61afef; background: #111e2e; }
    #notion-dl-btn.success { border-color: #4fbdba; color: #4fbdba; background: #111918; }
    #notion-dl-btn.error { border-color: #e06c75; color: #e06c75; background: #1e1617; }

    #cookies-dl-btn {
      width: 100%;
      padding: 9px;
      background: #272729;
      border: 1px solid #343536;
      border-radius: 6px;
      color: #818384;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    #cookies-dl-btn:hover { border-color: #98c379; color: #98c379; background: #141e16; }
    #cookies-dl-btn.success { border-color: #4fbdba; color: #4fbdba; background: #111918; }
    #cookies-dl-btn.error { border-color: #e06c75; color: #e06c75; background: #1e1617; }

    #color-pick-btn {
      width: 100%;
      padding: 9px;
      background: #272729;
      border: 1px solid #343536;
      border-radius: 6px;
      color: #818384;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    #color-pick-btn:hover { border-color: #e5c07b; color: #e5c07b; background: #1e1c16; }
    #color-pick-btn .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid #343536;
      background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
      flex-shrink: 0;
    }

    .color-history {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .color-history-label {
      font-size: 9px;
      color: #818384;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
    }
    .color-swatches {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .color-swatch-item {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: 1px solid #343536;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
      position: relative;
    }
    .color-swatch-item:hover {
      transform: scale(1.18);
      border-color: #d7dadc;
      box-shadow: 0 0 8px rgba(255,255,255,0.08);
    }
    .color-swatch-item:active {
      transform: scale(0.95);
    }
    .color-swatch-item .copy-tooltip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #343536;
      color: #d7dadc;
      font-size: 9px;
      padding: 3px 7px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      letter-spacing: 0.5px;
    }
    .color-swatch-item:hover .copy-tooltip {
      opacity: 1;
    }
    .color-empty-text {
      font-size: 9px;
      color: #4a4a4b;
      text-align: center;
    }

    #about-link {
      font-size: 10px;
      color: #4a4a4b;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: color 0.15s;
    }
    #about-link:hover { color: #818384; }

    /* Tab Resource Monitor */
    .resource-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .resource-header {
      font-size: 10px;
      color: #818384;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
    }
    .tab-list {
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .tab-list::-webkit-scrollbar { width: 4px; }
    .tab-list::-webkit-scrollbar-track { background: transparent; }
    .tab-list::-webkit-scrollbar-thumb { background: #343536; border-radius: 2px; }

    .tab-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #272729;
      border: 1px solid #343536;
      border-radius: 6px;
      min-height: 36px;
    }
    .tab-row.high-cpu { border-color: #e06c75; }
    .tab-row.mid-cpu { border-color: #e5c07b; }

    .tab-favicon {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .tab-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .tab-title {
      font-size: 10px;
      color: #d7dadc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-metrics {
      font-size: 9px;
      color: #818384;
      display: flex;
      gap: 6px;
    }
    .metric-cpu { color: #e06c75; font-weight: 600; }
    .metric-mem { color: #61afef; }

    .tab-suspend-btn {
      flex-shrink: 0;
      padding: 3px 6px;
      background: transparent;
      border: 1px solid #343536;
      border-radius: 4px;
      color: #818384;
      font-size: 9px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .tab-suspend-btn:hover { border-color: #c678dd; color: #c678dd; }
    .tab-suspend-btn.suspended { border-color: #4fbdba; color: #4fbdba; cursor: default; }

    .tab-empty {
      font-size: 10px;
      color: #4a4a4b;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <h1>UMBRA</h1>

  <button id="power-btn" title="Toggle dark mode">
    <svg viewBox="0 0 40 40">
      <path class="ring" d="M20 8 A14 14 0 1 1 19.99 8" stroke-dasharray="72 10" stroke-dashoffset="-5"/>
      <line class="stem" x1="20" y1="4" x2="20" y2="16"/>
    </svg>
  </button>

  <div id="status">Off</div>
  <div id="site-label"></div>

  <hr class="divider">

  <div class="counters">
    <div class="counter">
      <span class="counter-value" id="cookie-count">—</span>
      <span class="counter-label">Cookies</span>
    </div>
    <div class="counter">
      <span class="counter-value" id="storage-count">—</span>
      <span class="counter-label">Storage</span>
    </div>
  </div>

  <button id="clear-btn">Clear Site Data</button>

  <button id="cookies-dl-btn">↓ Download Cookies.txt</button>

  <button id="suspend-btn">Suspend Unpinned Tabs</button>

  <button id="notion-dl-btn" style="display:none;">↓ Download as Markdown</button>

  <button id="color-pick-btn">
    <span class="swatch"></span>
    Pick Color
  </button>

  <div class="color-history" id="color-history" style="display:none;">
    <div class="color-history-label">Recent Colors</div>
    <div class="color-swatches" id="color-swatches"></div>
  </div>

  <hr class="divider">

  <div class="resource-section">
    <div class="resource-header">Tab Resource Usage</div>
    <div class="tab-list" id="tab-list">
      <div class="tab-empty">Loading…</div>
    </div>
  </div>

  <a id="about-link" href="about.html" target="_blank">site effects &amp; coverage</a>

  <script src="popup.js"></script>
</body>
</html>
